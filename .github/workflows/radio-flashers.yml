name: Component host tests
on:
  workflow_dispatch:
    inputs:
      esphome_version:
        description: 'ESPHome version to check before upgrading the supported baseline'
        default: '2026.10.1'
        required: true
  pull_request:
    paths: ['components/**', 'tests/**', 'pyproject.toml', '.clang-format', '.github/workflows/radio-flashers.yml']
  push:
    branches: [main, 'codex/**']
    paths: ['components/**', 'tests/**', 'pyproject.toml', '.clang-format', '.github/workflows/radio-flashers.yml']
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install "esphome==${{ inputs.esphome_version || '2026.10.1' }}" pytest ruff==0.17.3 clang-format==23.1.3
      - name: Check component formatting
        run: |
          ruff check components/{tubeszb_web,network_settings,cc2652_flash_guard,zigbee_firmware_baud,cc2652_flasher,efr32_flasher}/*.py
          ruff format --check components/{tubeszb_web,network_settings,cc2652_flash_guard,zigbee_firmware_baud,cc2652_flasher,efr32_flasher}/*.py
          clang-format --dry-run --Werror components/tubeszb_web/*.{h,cpp} components/network_settings/*.{h,cpp} components/zigbee_firmware_baud/*.h components/cc2652_flash_guard/*.h

      - name: Supply the pinned JSON headers used by the tested ESPHome firmware
        run: git clone --depth 1 --branch v7.4.3 https://github.com/bblanchon/ArduinoJson.git /tmp/arduinojson
      - name: Check network transactions, web policy, native radio transport and saved baud
        env:
          ARDUINOJSON_INCLUDE: /tmp/arduinojson/src
        run: python -m pytest -q tests
